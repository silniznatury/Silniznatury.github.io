<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a0b">
  <title>Silni z Natury Coaching</title>

  <style>
    :root {
      --background: #080a0b;
      --surface: #111517;
      --text: #f5f7f7;
      --muted: #b3babb;
      --accent: #13c6ed;
      --border: rgba(255, 255, 255, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 20px 56px;
      background:
        radial-gradient(
          ellipse at 50% 0%,
          rgba(19, 198, 237, 0.1),
          transparent 38%
        ),
        var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: min(100%, 520px);
      margin: 0 auto;
      text-align: center;
    }

    .logo {
      display: block;
      width: 132px;
      height: 132px;
      margin: 0 auto 22px;
      border-radius: 24px;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 38px);
      line-height: 1.1;
      letter-spacing: -1px;
    }

    .intro {
      max-width: 440px;
      margin: 14px auto 24px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    .links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 0 auto 18px;
    }

    .link-button {
      min-height: 48px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: border-color 160ms ease, transform 160ms ease;
    }

    .link-button:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .button-logo {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      object-fit: contain;
    }

    .link-button svg {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
    }

    .link-button--wide {
      grid-column: 1 / -1;
    }

    .coaching-link {
      display: inline-block;
      margin: 4px 0 30px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .coaching-link:hover {
      text-decoration: underline;
    }

    .coaching {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(17, 21, 23, 0.8);
      text-align: left;
      scroll-margin-top: 20px;
    }

    .coaching h2 {
      margin: 0 0 10px;
      font-size: 23px;
    }

    .coaching p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .coaching-photo {
      display: block;
      width: 100%;
      max-height: 520px;
      border-radius: 12px;
      object-fit: cover;
      object-position: center;
    }

    footer {
      padding-top: 22px;
      color: #778184;
      font-size: 12px;
    }

    @media (max-width: 380px) {
      body {
        padding: 28px 14px 40px;
      }

      .links {
        gap: 8px;
      }

      .link-button {
        padding: 9px 6px;
        font-size: 13px;
      }

      .coaching {
        padding: 17px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <img
      class="logo"
      src="C422FA5D-E5C9-4350-B9A2-CF1C7B41958B.png"
      alt="Logo Silni z Natury"
    >

    <h1>Silni z Natury Coaching</h1>

    <p class="intro">
      Przygotowanie sportowe zawodników oraz rozwój trenerów, którzy ich szkolą.
    </p>

    <nav class="links" aria-label="Linki">
      <a
        class="link-button"
        href="https://app.fitr.training/t/208502/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          class="button-logo"
          src="C422FA5D-E5C9-4350-B9A2-CF1C7B41958B.png"
          alt=""
        >
        <span>Programy</span>
      </a>

      <a
        class="link-button"
        href="https://www.instagram.com/silniznatury/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect
            x="3" y="3" width="18" height="18" rx="5"
            stroke="currentColor" stroke-width="2"
          />
          <circle
            cx="12" cy="12" r="4"
            stroke="currentColor" stroke-width="2"
          />
          <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" />
        </svg>
        <span>Instagram</span>
      </a>

      <a
        class="link-button link-button--wide"
        href="https://docs.google.com/forms/d/1UWp950nsbaepRvYkkJl027rsehFRpnarST1urdwYRvA/viewform"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>Ankieta</span>
      </a>
    </nav>

    <a class="coaching-link" href="#coaching">
      Poznaj ofertę coachingową ↓
    </a>

    <section class="coaching" id="coaching">
      <h2>Coaching</h2>
      <p>
        Przygotowanie sportowe zawodników oraz rozwój trenerów, którzy ich szkolą.
      </p>
      <img
        class="coaching-photo"
        src="checa---direstomau---day3--13806_ef897be5-c753-458e-9f1a-4ae7392480ad.jpeg"
        alt="Zdjęcie z zawodów"
      >
    </section>

    <footer>Silni z Natury</footer>
  </main>
</body>
</html>
